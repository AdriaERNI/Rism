# git-cliff ~ release-notes generator.
# The GitHub Release body is generated from commit history — never hand
# maintained. CI runs `git-cliff` on every `v*` tag and uploads the output
# as the release description (see ci.yml release job).
#
# History convention: conventional commits (`type: subject`, one line).
# Only feat/fix are audience-facing; the rest stay in git.

[changelog]
header = ""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}\
{% if group == "Features" or group == "Bug Fixes" %}
### {{ group }}
{% for commit in commits | unique(attribute="message") %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endif %}\
{% endfor %}\
{% else %}\
## Unreleased
{% endif %}\
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^(docs|ci|chore|test|refactor|style|build|perf)", skip = true },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
