name: Windows Installer

# Proves the shipped Windows artifact on a real runner: build the release exe
# exactly as ci.yml's build job does, compile the Inno Setup installer, then
# silently install -> verify (PATH, version resource, failure contract, config
# pickup) -> in-place upgrade -> uninstall -> verify absence. This is the gate
# for the Microsoft Store submission (see docs/windows-store.md): the installer
# here IS the one that gets signed and submitted.
#
# NOTE: hosted Windows runners cannot run Linux containers (`services:` is
# Linux-runner-only; nested virtualization is unavailable), so this contract
# is deliberately server-free — like Prism's installer suite. Live-server
# correctness is CI-proven on Linux in ci.yml's live-smoke job.

on:
  push:
    branches: [main, development]
    tags: ["v*"]
    paths:
      - "installer/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    paths:
      - "installer/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

concurrency:
  group: installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  consistency:
    name: Static checks (no Windows build needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Installer script consistency
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File installer/static/analyze-install-consistency.ps1
      - name: Docs drift (tool count, config paths)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File installer/static/analyze-docs-drift.ps1

  verify:
    name: Install / upgrade / uninstall (windows-latest)
    runs-on: windows-latest
    needs: consistency
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer (same flags as ci.yml)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          & $iscc.FullName "/DAppVersion=$ver" "/DAppSource=..\..\target\release" installer/rism.iss
          if (-not (Test-Path "installer\Output\rism-$ver-setup.exe")) { Write-Error "installer missing"; exit 1 }
          "RISM_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install (silent)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "installer\Output\rism-$env:RISM_VERSION-setup.exe" `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "install exit $($p.ExitCode)"; exit 1 }

      - name: Verify installed exe + PATH + failure contract
        shell: pwsh
        run: |
          # per-machine install: Program Files\Rism on machine PATH
          $mp = [Environment]::GetEnvironmentVariable("Path","Machine")
          if ($mp -notlike "*$env:ProgramFiles\Rism*") {
            Write-Error "install dir not on machine PATH: $mp"; exit 1 }
          $exe = "$env:ProgramFiles\Rism\rism.exe"
          if (-not (Test-Path $exe)) { Write-Error "rism.exe missing"; exit 1 }
          # version resource matches the tag-derived installer version
          $info = (Get-Item $exe).VersionInfo
          if ($info.FileVersion -notlike "$env:RISM_VERSION*") {
            Write-Error "exe version '$($info.FileVersion)' != $env:RISM_VERSION"; exit 1 }
          # PATH resolution from a fresh shell context
          $env:Path = $mp
          $v = (Get-Command rism.exe).Source
          if ($v -ne "$env:ProgramFiles\Rism\rism.exe") { Write-Error "PATH resolves elsewhere: $v"; exit 1 }
          rism --version | Select-String ([regex]::Escape($env:RISM_VERSION))
          # offline command surface works on Windows
          rism --help | Out-Null
          # connection attempt against a dead port must FAIL CLEANLY
          $err = cmd /c "rism --url http://localhost:59999 info 2>&1"
          $code = $LASTEXITCODE
          if ($code -eq 0) { Write-Error "info against dead port should fail"; exit 1 }
          if ($err -match "panicked") { Write-Error "panic on connect failure"; exit 1 }
          Write-Host "clean-failure contract OK (exit $code)"

      - name: Verify config pickup (%APPDATA%\rism\config.toml)
        shell: pwsh
        run: |
          # config file at %APPDATA%\rism\config.toml must be picked up: point it
          # at a dead URL and require rism to fail citing THAT url — proof the
          # file loaded through the documented precedence chain (settings.rs)
          New-Item -ItemType Directory -Force "$env:APPDATA\rism" | Out-Null
          Set-Content "$env:APPDATA\rism\config.toml" 'iris_base_url = "http://127.0.0.1:59998"'
          $out = cmd /c "$env:ProgramFiles\Rism\rism.exe info 2>&1"
          if ($out -notmatch '59998') { Write-Error "config file not applied: $out"; exit 1 }
          Remove-Item "$env:APPDATA\rism\config.toml"

      - name: In-place upgrade (same version, silent)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "installer\Output\rism-$env:RISM_VERSION-setup.exe" `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "upgrade exit $($p.ExitCode)"; exit 1 }
          & "$env:ProgramFiles\Rism\rism.exe" --version

      - name: Uninstall (silent) + absence checks
        shell: pwsh
        run: |
          $un = "$env:ProgramFiles\Rism\unins000.exe"
          if (-not (Test-Path $un)) { Write-Error "unins000.exe missing"; exit 1 }
          $p = Start-Process -FilePath $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "uninstall exit $($p.ExitCode)"; exit 1 }
          if (Test-Path "$env:ProgramFiles\Rism\rism.exe") { Write-Error "exe survived"; exit 1 }
          $mp = [Environment]::GetEnvironmentVariable("Path","Machine")
          if ($mp -like "*$env:ProgramFiles\Rism*") { Write-Error "PATH entry survived"; exit 1 }
          Write-Host "clean uninstall OK"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: rism-windows-installer
          path: installer/Output/*.exe
