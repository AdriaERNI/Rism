name: CI

on:
  push:
    branches: [main, development]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  # End-to-end against a FRESH IRIS Community (same image Prism CI uses).
  # Rule inherited from Prism CI: anything the smoke creates is namespaced
  # RismCI.* and deleted afterwards — never query or touch pre-existing code.
  live-smoke:
    name: Live smoke (fresh IRIS)
    needs: test
    runs-on: ubuntu-latest
    services:
      iris:
        image: intersystemsdc/iris-community:2025.3
        ports:
          - 52773:52773
          - 1972:1972
        env:
          IRIS_USERNAME: _SYSTEM
          IRIS_PASSWORD: SYS
        options: >-
          --health-cmd "/irisHealth.sh"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 90s
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - name: Wait for Atelier API
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u _SYSTEM:SYS \
              http://localhost:52773/api/atelier/ || true)
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "Atelier API never answered (last code $code)"; exit 1
      - name: Smoke all doors end-to-end
        env:
          RISM_BIN: target/debug/rism
        run: |
          set -euo pipefail
          $RISM_BIN info | grep -q "IRIS for"

          # documents round-trip (create -> compile -> get -> delete)
          mkdir -p /tmp/ci && cat > /tmp/ci/t.cls <<'EOF'
          Class RismCI.Smoke Extends %RegisteredObject
          {
          ClassMethod Ok() As %Status
          {
            Quit $$$OK
          }
          }
          EOF
          $RISM_BIN doc put RismCI.Smoke.cls --file /tmp/ci/t.cls
          $RISM_BIN compile RismCI.Smoke.cls | grep -q "successfully"  # doc put skips compile
          $RISM_BIN doc get RismCI.Smoke.cls | grep -q "RismCI.Smoke"

          # SQL + terminal
          $RISM_BIN sql "select Name from %Dictionary.ClassDefinition where Name='RismCI.Smoke'" | grep -q "RismCI.Smoke"
          $RISM_BIN exec 'write "smoke-ok"' | grep -q "smoke-ok"

          # unit-testing trio (tests our own uploaded class)
          cat > /tmp/ci/test.cls <<'EOF'
          Class RismCI.SmokeTest Extends %UnitTest.TestCase
          {
          Method TestOk()
          {
            Do $$$AssertEquals(##class(RismCI.Smoke).Ok(), $$$OK)
          }
          }
          EOF
          $RISM_BIN doc put RismCI.SmokeTest.cls --file /tmp/ci/test.cls
          $RISM_BIN compile RismCI.SmokeTest.cls >/dev/null
          $RISM_BIN test list --filter RismCI | grep -q "SmokeTest"
          $RISM_BIN test run RismCI.SmokeTest | grep -qiE "pass|ok"
          $RISM_BIN test results --limit 1 >/dev/null

          # debugger (scripted session, entry breakpoint)
          $RISM_BIN debug run '##class(RismCI.Smoke).Ok()' --stop-on-entry | grep -q "ended"

          # monitor endpoints (Prometheus API lives beside Atelier)
          $RISM_BIN monitor | grep -qiE "overall|score"

          # cleanup — nothing persists on CI IRIS
          $RISM_BIN doc delete RismCI.SmokeTest.cls
          $RISM_BIN doc delete RismCI.Smoke.cls
          echo "LIVE SMOKE OK"

  # Tagged builds: Linux + Windows (x64/i686/arm64) binaries + installer,
  # packaged by `release`.
  build:
    name: Build ${{ matrix.label }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            ext: zip
          - os: windows-latest
            label: windows-i686
            target: i686-pc-windows-msvc
            ext: zip
          - os: windows-latest
            label: windows-arm64
            target: aarch64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Hosted runners ship the full MSVC toolset (x64 host + x86/arm64 cross
      # libs) — plain cargo cross-target builds, no linker overrides needed.
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build Inno Setup installer (Windows x64 only)
        if: matrix.label == 'windows-x86_64'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          & $iscc.FullName "/DAppVersion=$ver" "/DAppSource=..\..\target\${{ matrix.target }}\release" installer/rism.iss
          if (-not (Test-Path "installer\Output\rism-$ver-setup.exe")) { Write-Error "installer missing"; exit 1 }
      - name: Package archive
        shell: bash
        run: |
          VER=${GITHUB_REF_NAME#v}
          case "${{ matrix.os }}" in
            windows*) BIN="target/${{ matrix.target }}/release/rism.exe" ;;
            *)        BIN="target/${{ matrix.target }}/release/rism" ;;
          esac
          if [ "${{ matrix.ext }}" = "zip" ]; then
            cp "$BIN" rism.exe && 7z a -tzip "rism-${VER}-${{ matrix.label }}.zip" rism.exe && rm rism.exe
          else
            tar -czf "rism-${VER}-${{ matrix.label }}.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: rism-${{ github.ref_name }}-${{ matrix.label }}${{ matrix.label == 'windows-x86_64' && '-installer' || '' }}
          if-no-files-found: error
          path: |
            rism-*
            installer/Output/*.exe

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Pre-release detection (dev tags are prereleases, Git Flow)
        id: version
        run: |
          TAG=${GITHUB_REF_NAME}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: artifacts/**/*
