[package]
name = "rism"
version = "0.1.0"
edition = "2024"
description = "Rust MCP server and CLI for InterSystems IRIS development"
license = "AGPL-3.0"
repository = "https://git.vortexis.eu/blkpws/Rism"
rust-version = "1.85"

[lib]
name = "rism"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process", "time", "io-util", "io-std", "fs", "signal"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
rmcp = { version = "3.4", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
urlencoding = "2"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
glob = "0.3"
toml = "0.9"
base64 = "0.22"
xmltree = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
